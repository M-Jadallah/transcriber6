# =============================================================================
# docker-compose.yml — Multi-service YouTube transcription + formatting app
# =============================================================================
# 11 services total:
#   1. app             — Next.js standalone server (exposed via Coolify FQDN)
#   2. realtime        — Socket.io mini-service (exposed via own Coolify FQDN)
#   3-7. worker-t1..t5 — 5 transcription workers (internal, yt-dlp + Deepgram)
#   8-9. opencode-1,2  — 2 OpenCode formatting workers (internal)
#   10. postgres       — PostgreSQL 17 (internal)
#   11. redis          — Redis 7 with auth + AOF (internal)
#
# ─── COOLIFY RULES APPLIED (from RESEARCH-6) ─────────────────────────────────
#   ✓ NO `networks:` block — Coolify auto-creates one per stack.
#   ✓ NO `version:` field — deprecated in modern Compose spec.
#   ✓ NO `deploy.replicas` — each worker is a separate named service (distinct WORKER_ID).
#   ✓ Internal services: no `ports:` + no FQDN assignment.
#   ✓ `depends_on: { service: { condition: service_healthy } }` — supported.
#   ✓ Named volumes only (no bind mounts) — postgres UID 999 issue avoided.
#   ✓ Magic env vars: SERVICE_PASSWORD_POSTGRES, SERVICE_PASSWORD_REDIS,
#     SERVICE_PASSWORD_64_NEXTAUTH, SERVICE_FQDN_APP_3000, SERVICE_FQDN_REALTIME_3001.
#   ✓ MAP syntax for environment (NOT list syntax) — avoids Coolify
#     "non-string key in services.X.environment: 0" parsing bug.
#
# ─── USER-PROVIDED ENV VARS (set in Coolify UI) ──────────────────────────────
#   ADMIN_USERNAME      — admin login username (required)
#   ADMIN_PASSWORD      — admin login password (required, mark as locked secret)
#   DEEPGRAM_API_KEY_1  — Deepgram API key for worker-t1 (required, secret)
#   DEEPGRAM_API_KEY_2  — Deepgram API key for worker-t2 (required, secret)
#   DEEPGRAM_API_KEY_3  — Deepgram API key for worker-t3 (required, secret)
#   DEEPGRAM_API_KEY_4  — Deepgram API key for worker-t4 (required, secret)
#   DEEPGRAM_API_KEY_5  — Deepgram API key for worker-t5 (required, secret)
#   OPENCODE_AUTH_JSON  — (OPTIONAL) multiline JSON for OpenCode auth.json
#
# ─── AUTO-GENERATED BY COOLIFY (do NOT set manually) ─────────────────────────
#   SERVICE_FQDN_APP_3000           — app's public FQDN (Traefik routes port 3000)
#   SERVICE_FQDN_REALTIME_3001      — realtime's public FQDN (port 3001)
#   SERVICE_PASSWORD_POSTGRES       — postgres password
#   SERVICE_PASSWORD_REDIS          — redis password
#   SERVICE_PASSWORD_64_NEXTAUTH    — NextAuth secret + REALTIME_SECRET (64 chars)
# =============================================================================

services:
  # ─── 1. Next.js app (exposed, internet-facing) ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_URL: ${SERVICE_FQDN_REALTIME_3001:-http://localhost:3001}
    restart: unless-stopped
    environment:
      # Magic var declaration (empty value triggers Coolify auto-generation + Traefik routing)
      SERVICE_FQDN_APP_3000:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEXTAUTH_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH:-dev-secret-change-me}
      NEXTAUTH_URL: ${SERVICE_FQDN_APP_3000:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DEEPGRAM_API_KEY_1: ${DEEPGRAM_API_KEY_1:?DEEPGRAM_API_KEY_1 is required}
      DEEPGRAM_API_KEY_2: ${DEEPGRAM_API_KEY_2:?DEEPGRAM_API_KEY_2 is required}
      DEEPGRAM_API_KEY_3: ${DEEPGRAM_API_KEY_3:?DEEPGRAM_API_KEY_3 is required}
      DEEPGRAM_API_KEY_4: ${DEEPGRAM_API_KEY_4:?DEEPGRAM_API_KEY_4 is required}
      DEEPGRAM_API_KEY_5: ${DEEPGRAM_API_KEY_5:?DEEPGRAM_API_KEY_5 is required}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH:-dev-secret-change-me}
      NEXT_PUBLIC_REALTIME_URL: ${SERVICE_FQDN_REALTIME_3001:-http://localhost:3001}
      SKILLS_DIR: /data/skills
    volumes:
      - skills-shared:/data/skills:ro
      - app-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ─── 2. Realtime (Socket.io, exposed, own FQDN) ────────────────────────────
  realtime:
    build: ./mini-services/realtime
    restart: unless-stopped
    environment:
      SERVICE_FQDN_REALTIME_3001:
      ALLOWED_ORIGIN: ${SERVICE_FQDN_APP_3000:-*}
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH:-dev-secret-change-me}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── 3-7. Transcription workers (5×, internal only) ────────────────────────
  worker-t1:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "workers/transcribe.ts"]
    restart: unless-stopped
    environment:
      WORKER_INDEX: "1"
      WORKER_ID: transcribe-1
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPGRAM_API_KEY_1: ${DEEPGRAM_API_KEY_1}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      AUDIO_DIR: /data/audio
    volumes:
      - audio-data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-t2:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "workers/transcribe.ts"]
    restart: unless-stopped
    environment:
      WORKER_INDEX: "2"
      WORKER_ID: transcribe-2
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPGRAM_API_KEY_2: ${DEEPGRAM_API_KEY_2}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      AUDIO_DIR: /data/audio
    volumes:
      - audio-data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-t3:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "workers/transcribe.ts"]
    restart: unless-stopped
    environment:
      WORKER_INDEX: "3"
      WORKER_ID: transcribe-3
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPGRAM_API_KEY_3: ${DEEPGRAM_API_KEY_3}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      AUDIO_DIR: /data/audio
    volumes:
      - audio-data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-t4:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "workers/transcribe.ts"]
    restart: unless-stopped
    environment:
      WORKER_INDEX: "4"
      WORKER_ID: transcribe-4
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPGRAM_API_KEY_4: ${DEEPGRAM_API_KEY_4}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      AUDIO_DIR: /data/audio
    volumes:
      - audio-data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-t5:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "workers/transcribe.ts"]
    restart: unless-stopped
    environment:
      WORKER_INDEX: "5"
      WORKER_ID: transcribe-5
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEEPGRAM_API_KEY_5: ${DEEPGRAM_API_KEY_5}
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      AUDIO_DIR: /data/audio
    volumes:
      - audio-data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 8-9. OpenCode formatting workers (2×, internal only) ──────────────────
  opencode-1:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    restart: unless-stopped
    environment:
      WORKER_ID: opencode-1
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      SKILLS_DIR: /data/skills
      JOBS_DIR: /data/jobs
      OPENCODE_AUTH_JSON: ${OPENCODE_AUTH_JSON}
    volumes:
      - skills-shared:/data/skills:rw
      - opencode-jobs:/data/jobs
      - opencode-auth:/root/.local/share/opencode
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  opencode-2:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    restart: unless-stopped
    environment:
      WORKER_ID: opencode-2
      NODE_ENV: production
      DATABASE_URL: postgresql://app:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/app?schema=public
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REALTIME_INTERNAL_URL: http://realtime:3001
      REALTIME_SECRET: ${SERVICE_PASSWORD_64_NEXTAUTH}
      SKILLS_DIR: /data/skills
      JOBS_DIR: /data/jobs
      OPENCODE_AUTH_JSON: ${OPENCODE_AUTH_JSON}
    volumes:
      - skills-shared:/data/skills:rw
      - opencode-jobs:/data/jobs
      - opencode-auth:/root/.local/share/opencode
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 10. PostgreSQL (internal only) ────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── 11. Redis (internal only) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${SERVICE_PASSWORD_REDIS}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# ─── Named volumes (Coolify auto-prefixes with resource UUID) ─────────────────
volumes:
  pgdata:
  redisdata:
  skills-shared:
  audio-data:
  app-data:
  opencode-jobs:
  opencode-auth:
